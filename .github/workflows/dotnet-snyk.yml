name: Snyk test for dotnet
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      working-directory: ./backend
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET 6.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x

      - name: Install dependencies
        run: dotnet restore
        working-directory: ${{env.working-directory}}

      - name: Build
        run: |
          dotnet build --configuration Release --no-restore
          echo ${{ github.workspace }}
          echo $GITHUB_WORKSPACE
        working-directory: ${{env.working-directory}}

      - name: Install Snyk
        run: curl -sL https://deb.snyk.io/snyk-apt/apt/sources.list.d/snyk.list | sudo tee /etc/apt/sources.list.d/snyk.list && curl -sL https://deb.snyk.io/snyk-apt/signing-key.asc | sudo apt-key add - && sudo apt-get update && sudo apt-get install snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run Snyk Test
        working-directory: ${{env.working-directory}}
        run: snyk test --severity-threshold=medium
